[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sflad"
version = "0.1.0"
description = "Source-free log anomaly detection on AWS Lambda logs: evaluation runs, detectors and analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "joblib>=1.3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "boto3>=1.34",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
